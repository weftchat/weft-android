<!DOCTYPE html>
<!-- Weft group call page (Phase 4): a WebRTC mesh, one connection per other person, relay only.
     Frame encryption is SimpleX's (callCrypto in ../call.js, AGPL-3.0). -->
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 14px; height: 100%; box-sizing: border-box; }
      #grid video { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; background: #101019; }
      #grid:empty { display: none; }
    </style>
    <script src="../lz-string.min.js"></script>
  </head>
  <body>
    <div id="grid"></div>
    <script src="../call.js"></script>
    <script src="./group-call.js"></script>
  </body>
</html>
