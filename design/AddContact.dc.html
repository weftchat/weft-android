<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weft · Add contact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0A0A12;font-family:'Manrope', -apple-system, 'Segoe UI', sans-serif;color:#F4F3FF}
a{color:#A78BFA}a:hover{color:#C4B5FD}
button,input{font-family:inherit}button{cursor:pointer}
input::placeholder{color:#7F7DA0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 0; display: flex; flex-direction: column; background: #0A0A12; color: #F4F3FF; font-family: 'Manrope', -apple-system, 'Segoe UI', sans-serif; overflow: hidden; "><div style="padding: 56px 16px 10px; display: flex; align-items: center; gap: 8px; flex: none;">
<a href="Chats.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;  display: grid; place-items: center; color: #F4F3FF;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
<h1 style="margin: 0 0 0 4px; flex-grow: 1; font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">Add contact</h1>
</div>
<div style="padding: 8px 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 22px; flex-grow: 1;">
<p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #9A98B5; text-align: center; text-wrap: pretty;">Show this code in person. It works <span style="color: #F4F3FF; font-weight: 700;">once</span> and carries no identifier of yours.</p>
<div style="position: relative; display: grid; place-items: center;">
<span style="position: absolute; inset: 10px; border-radius: 40px; background: linear-gradient(135deg, {{accent}}, {{accent2}}); opacity: 0.35; filter: blur(30px);"></span>
<div style="position: relative; background: #FFFFFF; border-radius: 26px; padding: 18px;">
<div style="display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); width: 250px; height: 250px;" role="img" aria-label="One-time invitation QR code">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
<span style="display: block; width: 10px; height: 10px; background: {{c.bg}};"></span>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #9A98B5; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; border-radius: 999px; padding: 8px 14px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>expires in <span style="color: #F4F3FF; font-weight: 600;">09:41</span></div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; background: linear-gradient(135deg, {{accent}}, {{accent2}}); color: #0B0B14; font-weight: 800; font-size: 15px; letter-spacing: -0.01em; text-decoration: none; border: 0; box-shadow: 0 10px 30px -12px {{accent}};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4M7 12h10"></path></svg>Scan their code</button>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;  color: #F4F3FF; font-weight: 700; font-size: 14px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"></path></svg>Copy one-time link</button>
</div>
<p style="margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 1.55; color: #7F7DA0; text-align: center;">share it only through a channel you trust · then compare fingerprints in person</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A78BFA","options":["#A78BFA","#5CF0B8","#60A5FA","#F9A8D4"],"section":"Gradient"},"accent2":{"editor":"color","default":"#C4B5FD","options":["#C4B5FD","#A7F3D0","#93C5FD","#FBCFE8"],"section":"Gradient"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 25;
    let seed = 20260921;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const finder = (r, c, r0, c0) => { const dr = r - r0, dc = c - c0; if (dr < 0 || dc < 0 || dr > 6 || dc > 6) return null; return dr === 0 || dr === 6 || dc === 0 || dc === 6 || (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4); };
    const inQuiet = (r, c, r0, c0) => r >= r0 - 1 && r <= r0 + 7 && c >= c0 - 1 && c <= c0 + 7;
    const cells = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      let on;
      const f = finder(r, c, 0, 0) ?? finder(r, c, 0, 18) ?? finder(r, c, 18, 0);
      if (f !== null) on = f;
      else if (inQuiet(r, c, 0, 0) || inQuiet(r, c, 0, 18) || inQuiet(r, c, 18, 0)) on = false;
      else if (r === 6) on = c % 2 === 0;
      else if (c === 6) on = r % 2 === 0;
      else on = rnd() > 0.52;
      cells.push({ bg: on ? '#0B0B14' : '#FFFFFF' });
    }
    return { accent: this.props.accent ?? '#A78BFA', accent2: this.props.accent2 ?? '#C4B5FD', cells };
  }
}
</script>
</body>
</html>
