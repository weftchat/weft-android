<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weft · Unlock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0A0A12;font-family:'Manrope', -apple-system, 'Segoe UI', sans-serif;color:#F4F3FF}
a{color:#A78BFA}a:hover{color:#C4B5FD}
button,input{font-family:inherit}button{cursor:pointer}
input::placeholder{color:#7F7DA0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 96px 24px 48px; display: flex; flex-direction: column; background: #0A0A12; color: #F4F3FF; font-family: 'Manrope', -apple-system, 'Segoe UI', sans-serif; overflow: hidden; align-items: center; gap: 28px;">
<div style="position: relative; width: 56px; height: 56px; display: grid; place-items: center;"><span style="position: absolute; inset: -18px; border-radius: 999px; background: {{accent}}; opacity: 0.22; filter: blur(22px);"></span><span style="position: relative; display: grid;"><svg width="56" height="56" viewBox="0 0 28 28" aria-hidden="true"><defs><linearGradient id="lgUnlock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{accent}}"></stop><stop offset="1" stop-color="{{accent2}}"></stop></linearGradient></defs><rect x="0" y="0" width="28" height="28" rx="8" fill="url(#lgUnlock)"></rect><path d="M8 10l5 4-5 4M15 19h6" stroke="#0B0B14" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;">Enter your PIN</h1>
<p style="margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #9A98B5;">6 digits · wrong PIN 10× wipes this phone</p>
</div>
<div style="display: flex; gap: 14px; height: 16px;" aria-label="Digits entered">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
<span style="width: 14px; height: 14px; border-radius: 999px; box-sizing: border-box; border: 2px solid {{d.bd}}; background: {{d.bg}}; box-shadow: {{d.glow}};"></span>
</sc-for>
</div>
<div style="height: 48px; display: flex; align-items: center;">
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a href="Chats.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 44px; padding: 0 22px; font-size: 14px; border-radius: 999px; background: linear-gradient(135deg, {{accent}}, {{accent2}}); color: #0B0B14; font-weight: 800; font-size: 15px; letter-spacing: -0.01em; text-decoration: none; border: 0; box-shadow: 0 10px 30px -12px {{accent}};">Unlock<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B0B14" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 24px; justify-items: center; width: 300px;">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="9">
<button type="button" onClick="{{k.press}}" style="width: 78px; height: 78px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;  color: #F4F3FF; font-size: 28px; font-weight: 600;">{{k.label}}</button>
</sc-for>
<span style="width: 78px; height: 78px;"></span>
<button type="button" onClick="{{zero}}" style="width: 78px; height: 78px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;  color: #F4F3FF; font-size: 28px; font-weight: 600;">0</button>
<button type="button" onClick="{{back}}" aria-label="Delete digit" style="width: 78px; height: 78px; border-radius: 999px; background: transparent; border: 0; color: #9A98B5; display: grid; place-items: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"></path><path d="m17 9-6 6M11 9l6 6"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A78BFA","options":["#A78BFA","#5CF0B8","#60A5FA","#F9A8D4"],"section":"Gradient"},"accent2":{"editor":"color","default":"#C4B5FD","options":["#C4B5FD","#A7F3D0","#93C5FD","#FBCFE8"],"section":"Gradient"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#A78BFA';
    const accent2 = this.props.accent2 ?? '#C4B5FD';
    const pin = (this.state && this.state.pin != null) ? this.state.pin : 3;
    const add = () => this.setState({ pin: Math.min(6, pin + 1) });
    const dots = [0, 1, 2, 3, 4, 5].map((i) => ({
      bg: i < pin ? accent : 'transparent',
      bd: i < pin ? accent : '#3A3A4E',
      glow: i < pin ? '0 0 12px ' + accent : 'none'
    }));
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((l) => ({ label: l, press: add }));
    return { accent, accent2, dots, keys, zero: add, back: () => this.setState({ pin: Math.max(0, pin - 1) }), done: pin >= 6 };
  }
}
</script>
</body>
</html>
